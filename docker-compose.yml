version: '3.9'

services:
  fleetguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetguard-api
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Opcional: Agregador de logs
  # logs:
  #   image: busybox
  #   volumes:
  #     - ./logs:/var/log/app
  #   command: tail -f /var/log/app/app.log